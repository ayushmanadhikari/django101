{% extends 'blog/base.html' %}
{% block content%}
    <body>
        {% for post in posts %}
        <h2>{{ post.title }}</h2>
        <p>{{ post.content }}</p>
        <p><strong>Author:</strong> {{ post.author }}</p>
        <p><strong>Date Posted:</strong> {{ post.date_posted }}</p>
        {% endfor %}
    </body>
{% endblock content %}
